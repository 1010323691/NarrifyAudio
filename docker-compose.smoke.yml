services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: smoke-api

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: smoke-api
    environment:
      NARRIFY_COOKIE_SECURE: "false"
      NARRIFY_REGISTRATION_ENABLED: "true"
      NARRIFY_INITIAL_QUOTA_UNITS: "12"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: smoke-api
    command: ["sh", "-c", "NARRIFY_WORKER_ID=worker-$$HOSTNAME python -m backend.worker"]

  llm-stub:
    build:
      context: .
      dockerfile: Dockerfile
      target: smoke-api
    environment:
      NARRIFY_LLM_STUB_DELAY: "0.25"
    command: ["python", "scripts/llm_stub.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 20
    profiles: ["smoke"]

  smoke:
    build:
      context: .
      dockerfile: Dockerfile
      target: smoke-api
    environment:
      SMOKE_BASE_URL: "http://api:8642"
      SMOKE_ADMIN_EMAIL: "admin@example.com"
      SMOKE_ADMIN_PASSWORD: "smoke-admin-password-123"
      SMOKE_LLM_BASE_URL: "http://llm-stub:8090/v1"
    command: ["python", "scripts/docker_smoke.py"]
    depends_on:
      api:
        condition: service_healthy
      llm-stub:
        condition: service_healthy
    profiles: ["smoke"]
