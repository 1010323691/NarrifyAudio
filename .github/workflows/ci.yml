# CI 门禁：与本地 `npm run build:all`（Vite 生产构建 + 分层门禁）+ 后端全量测试等价；
# 前端 job 另含 4 个 node:test 沙箱回归（build:all 不含，本地对应 `npm run test:*`）。
# - frontend: 类型检查 + Vite 生产构建 + node:test 沙箱回归（store 状态隔离 + 三个工作台）
# - backend:  语法检查 + api→services→platform→core 分层门禁 + pytest 全量套件
#
# 私有仓库免费 runner 分钟有限：两个 job 并行跑，同一分支的旧运行自动取消。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 按改动路径决定跑哪些 job：只改文档不跑任何测试；只改前端不装 Python/ffmpeg，反之亦然。
  # push 到 main 一律全跑。被 `if` 跳过的 job 在分支保护里视为通过。
  changes:
    name: 变更路径检测
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.f.outputs.frontend }}
      backend: ${{ steps.f.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"; echo "backend=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$files"
          # 逐文件归类：纯文档不触发；前端专属/后端专属只触发对应端；
          # 其余一切（CI 本身、依赖清单、根 setting.json、launch/、迁移配置……）两端都跑——
          # 白名单漏路径时宁可多跑，不静默跳过。
          fe=false; be=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|*.md|LICENSE) ;;
              src/*|public/*|index.html|vite.config.*|tsconfig*|tailwind.config.*|postcss.config.*) fe=true ;;
              scripts/*.py|backend/*|tts-engine/*) be=true ;;
              scripts/*.mjs) fe=true ;;
              .github/*|package.json|package-lock.json) fe=true; be=true ;;
              *) fe=true; be=true ;;
            esac
          done <<< "$files"
          echo "frontend=$fe" >> "$GITHUB_OUTPUT"
          echo "backend=$be" >> "$GITHUB_OUTPUT"

  frontend:
    name: 前端 typecheck / build / 沙箱回归
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # build 已含 vue-tsc --noEmit 类型检查 + Vite 生产构建
      - name: 类型检查 + 生产构建
        run: npm run build

      # 13 个 node:test 沙箱回归（store 状态隔离、项目总览/卡片、任务中心、制作工作台、
      # 资源中心、管理控制台、行高算法、三个工作台组合逻辑）合为一次 `node --test`，
      # 文件级并行、只付一次启动开销；清单见 package.json 的 test:ci。
      - name: 沙箱回归（node:test 合并）
        run: npm run test:ci

  backend:
    name: 后端 pytest 分片 ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # test_audio 的 FFmpeg 集成用例按 shutil.which 探测 PATH，装上才跑
      - name: 安装 FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: 安装核心依赖（不含 TTS GPU 栈）
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          # requirements.txt 的 TTS 块（qwen-tts/transformers/accelerate/huggingface_hub）
          # 会拖进数 GB 的 torch CUDA 轮子；测试套件从不 import torch/模型代码——TTS
          # worker 是子进程且顶层仅 stdlib（test_tts_worker.py 钉住这一隔离），真实 TTS
          # 冒烟只在带 GPU 的本机跑。CI 因此只装核心依赖。
          grep -Ev '^(qwen-tts|transformers|accelerate|huggingface_hub)\b' \
            backend/requirements.txt > /tmp/requirements-ci.txt
          .venv/bin/python -m pip install --quiet -r /tmp/requirements-ci.txt
          # 分层门禁 CLI（本地由共享 .venv 提供，见 scripts/build-all.mjs）
          .venv/bin/python -m pip install --quiet import-linter

      # 本地 build:all 的后端两半：Python 语法/字节码检查 + .importlinter 分层契约
      - name: compileall + lint-imports
        if: matrix.shard == 1
        run: |
          .venv/bin/python -m compileall -q backend tts-engine
          .venv/bin/lint-imports

      # 套件固定用 xdist + loadscope（test_platform 依赖同文件前序用例的模块级状态，
      # 同一文件必须留在一个 worker 内按序跑）。worker 数按 runner 的 2 vCPU 取 2
      # ——本机 16 核的 -n 4 基准不适用于 CI（基准数据见 CLAUDE.md）。
      # 全套件跑在 sqlite + 临时存储上（conftest 覆盖 NARRIFY_DATABASE_URL 等），
      # 不需要 PostgreSQL/Memurai；无 DB 的真实库用例自动 skip。
      # skip 构成两端不同（本 CI 8 skipped，本地基准 4 skipped），属正常（不是失败）：
      # - 真实 DB ×2（无 NARRIFY_TEST_POSTGRES_URL）+ redis 验收（无 NARRIFY_TEST_REDIS_URL）：两端都跳过；
      # - storage migration ×4：CI runner 无 PG 二进制故跳过，装有 PG 的本机执行；
      # - test_pathio（Windows-only）：Linux 上跳过；
      # - test_admin_console 的 symlink 用例：本地非提权 Windows 无目录 symlink 权限故跳过，CI 执行；
      # - test_audio FFmpeg ×3：仅当 ffmpeg/ffprobe 不在 PATH 时跳过——本 job 安装 FFmpeg，两端都执行。
      # 命令带 -rs 让 SKIPPED 原因逐条进日志；数量与本地对不上时先看这些行再判断。
      # 分片：按测试文件整体切 3 片，用 backend/tests/shard_weights.json 的实测耗时均衡（见 conftest.py，保持 loadscope 语义）。
      - name: 测试套件分片
        run: .venv/bin/python -m pytest backend/tests -n 2 --dist loadscope -rs --shard ${{ matrix.shard }}/3
