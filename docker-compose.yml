services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: narrify
      POSTGRES_USER: narrify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - narrify-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narrify -d narrify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - narrify-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      NARRIFY_DATABASE_URL: postgresql+psycopg://narrify:${POSTGRES_PASSWORD}@postgres:5432/narrify
      NARRIFY_AUTO_CREATE_SCHEMA: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      NARRIFY_DATABASE_URL: postgresql+psycopg://narrify:${POSTGRES_PASSWORD}@postgres:5432/narrify
      NARRIFY_REDIS_URL: redis://redis:6379/0
      NARRIFY_AUTO_CREATE_SCHEMA: "false"
      NARRIFY_STORAGE_ROOT: /var/lib/narrify/storage
      NARRIFY_COOKIE_SECURE: "true"
      NARRIFY_BOOTSTRAP_ADMIN_EMAIL: ${NARRIFY_BOOTSTRAP_ADMIN_EMAIL:?set NARRIFY_BOOTSTRAP_ADMIN_EMAIL in .env}
      NARRIFY_BOOTSTRAP_ADMIN_PASSWORD: ${NARRIFY_BOOTSTRAP_ADMIN_PASSWORD:?set NARRIFY_BOOTSTRAP_ADMIN_PASSWORD in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - narrify-storage:/var/lib/narrify/storage
    ports:
      - "8642:8642"
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8642"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      NARRIFY_DATABASE_URL: postgresql+psycopg://narrify:${POSTGRES_PASSWORD}@postgres:5432/narrify
      NARRIFY_REDIS_URL: redis://redis:6379/0
      NARRIFY_AUTO_CREATE_SCHEMA: "false"
      NARRIFY_STORAGE_ROOT: /var/lib/narrify/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - narrify-storage:/var/lib/narrify/storage
    command: ["python", "-m", "backend.worker"]

volumes:
  narrify-postgres:
  narrify-redis:
  narrify-storage:
